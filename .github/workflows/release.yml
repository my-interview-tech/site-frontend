name: release

on:
  push:
    branches: [release, master]

concurrency:
  group: release-publish
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

# setup-node с cache: yarn вызывает yarn до шагов с env, а Yarn 1 падает без NPM_TOKEN из .npmrc
env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN_READ }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN || github.token }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile --ignore-scripts
        env:
          HUSKY: 0
          NPM_TOKEN: ${{ secrets.NPM_TOKEN_READ }}

      - name: Wait for back-merge
        if: github.ref == 'refs/heads/release'
        run: |
          git fetch origin master
          if [ "$(git rev-list --count HEAD..origin/master -- packages)" != "0" ]; then
            echo "::error::В master есть коммиты packages/, которых нет в release. Сначала влить back-merge."
            exit 1
          fi

      - name: Version or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: yarn changeset version
          publish: scripts/publish-packages.sh
          commit: "chore: version packages"
          title: Version Packages
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN_PUBLISH }}

      - name: Attach tarballs
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: printf '%s' "$PUBLISHED" | scripts/attach-release-tarballs.sh --json

  bump-site:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: scripts/bump-site.sh
        env:
          HUSKY: 0
          NPM_TOKEN: ${{ secrets.NPM_TOKEN_READ }}
          GH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
          PUBLISHED: ${{ needs.release.outputs.publishedPackages }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
