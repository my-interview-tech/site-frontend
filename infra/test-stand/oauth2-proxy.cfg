provider = "github"
github_org = "my-interview-tech"
github_team = "test-access"
email_domains = ["*"]
cookie_name = "_test_auth"
cookie_secure = true
cookie_samesite = "lax"
cookie_expire = "168h"
cookie_domains = [".test.my-interview.tech"]
reverse_proxy = true
set_xauthrequest = true
http_address = "0.0.0.0:4180"
upstreams = ["static://202"]
redirect_url = "https://test.my-interview.tech/oauth2/callback"
whitelist_domains = [".test.my-interview.tech"]
skip_provider_button = false
