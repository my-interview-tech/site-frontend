services:
  verdaccio:
    image: verdaccio/verdaccio:6
    restart: unless-stopped
    ports:
      - 127.0.0.1:4873:4873
    volumes:
      - ./config.yaml:/verdaccio/conf/config.yaml:ro
      - ./htpasswd:/verdaccio/conf/htpasswd:ro
      - verdaccio-storage:/verdaccio/storage
    healthcheck:
      test:
        [
          CMD-SHELL,
          "node -e \"fetch('http://127.0.0.1:4873/-/ping').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  verdaccio-storage:
